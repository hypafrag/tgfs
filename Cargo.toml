[package]
name = "tgfs"
version = "0.1.0"
edition = "2024"
# Unit tests live at `tests/<module>.rs` and are attached to their source
# module via `#[path = "../tests/<module>.rs"] mod tests;`. Disable Cargo's
# integration-test auto-discovery so it doesn't try to build those files as
# standalone test binaries.
autotests = false

[dependencies]
grammers-client = "0.9"
grammers-mtsender = { version = "0.9", features = ["proxy"] }
grammers-session = "0.9"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
anyhow = "1"
rpassword = "7"
serde_yaml = "0.9"
serde_json = "1.0"
axum = "0.8"
tokio-stream = "0.1"
tokio-util = { version = "0.7", features = ["io"] }
async-compression = { version = "0.4", features = ["tokio", "deflate"] }
urlencoding = "2"
bytes = "1"
mime_guess = "2"
smallvec = "1"
fuser = "0.17"
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs"] }
libc = "0.2"
log = "0.4"
env_logger = "0.11"
sha2 = "0.10"
aes = "0.8"
ctr = "0.9"
crc32fast = "1"
getrandom = "0.2"
indicatif = "0.17"
console = "0.15"
hunch = { version = "2", default-features = false }
# Library use of hunch requires it as a regular dep, not dev-only — it's also
# used by tgfs itself to apply per-channel `tvshow_pattern` rewrites.
# tgup uses reqwest to call the TVmaze REST API. blocking + async clients are
# both compiled in so the integration tests (which call HTTP from inside
# `spawn_blocking` closures) and tgup (which lives on the tokio runtime) can
# share the same crate. rustls-tls keeps us off the system OpenSSL.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
image = { version = "0.25", default-features = false, features = ["jpeg"] }

[[bin]]
name = "tgfs"
path = "src/main.rs"

[[bin]]
name = "tgup"
path = "src/bin/tgup/main.rs"

# Until upstream grammers ships a fix for `channels.deleteMessages` not carrying
# the deleted message IDs through to `UpdateDeleteChannelMessages.messages`,
# point all grammers crates at the patched fork. The branch is the PR/MR.
[patch.crates-io]
grammers-client = { git = "https://codeberg.org/hypafrag/grammers.git", branch = "fix/deleted_messages_notified" }
grammers-mtsender = { git = "https://codeberg.org/hypafrag/grammers.git", branch = "fix/deleted_messages_notified" }
grammers-session = { git = "https://codeberg.org/hypafrag/grammers.git", branch = "fix/deleted_messages_notified" }
grammers-mtproto = { git = "https://codeberg.org/hypafrag/grammers.git", branch = "fix/deleted_messages_notified" }
grammers-tl-types = { git = "https://codeberg.org/hypafrag/grammers.git", branch = "fix/deleted_messages_notified" }

[dev-dependencies]
zip = { version = "2", default-features = false, features = ["deflate"] }
hex = "0.4"
base64 = "0.22"
# FSEvents on macOS / inotify on Linux — native, never polling.
notify = { version = "8", default-features = false, features = ["macos_fsevent"] }

# The integration test is an example because examples have access to
# dev-dependencies (regular [[bin]] targets don't). Invoke as:
#   cargo run --example integration_test
[[example]]
name = "integration_test"
path = "examples/integration_test.rs"

[[example]]
name = "tgup_integration_test"
path = "examples/tgup_integration_test.rs"
