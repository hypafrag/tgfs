# spec-version: 3
channel:
  name: TGFS Test
  messages:
    # Simple text-only message
    - text: |
        Hello from test channel.
        This message has no attachments.

    # Message with plain text files
    - text: Message with text attachments
      files:
        - name: readme.txt
          text: |
            This is a plain text file.
            Multiple lines are supported.

        - name: config.json
          text: |
            {
              "env": "test",
              "debug": true
            }

    # Message with binary blob attachment
    - text: Message with binary file
      files:
        - name: image.png
          blob: |
            iVBORw0KGgoAAAANSUhEUgAAAAUA
            AAAFCAYAAACNbyblAAAAHElEQVQI12P4
            //8/w38GIAXDIBKE0DHxgljNBAAO
            9TXL0Y4OHwAAAABJRU5ErkJggg==

    # Message using the `path:` directive to place a single file under a virtual dir.
    - text: |
        path: docs/

      files:
        - name: notes.md
          text: |
            Filed under docs/ via the `path:` caption directive.

    # Message with ZIP archive — each inner file specifies its compression
    # via the `deflated` flag. Default for omitted flag is `true`.
    - text: Message with zip archive
      files:
        - name: project.zip
          zip:
            # File in archive root (deflated)
            - name: README.md
              deflated: true
              text: |
                # Demo Project
                This file is inside ZIP archive.

            # Binary file in archive root, stored (not deflated)
            - name: logo.bin
              deflated: false
              blob: |
                AAECAwQFBgcICQoLDA0ODw==

            # Directory in archive
            - name: src
              content:
                - name: main.py
                  deflated: true
                  text: |
                    def main():
                        print("hello")

                    if __name__ == "__main__":
                        main()

                - name: utils
                  content:
                    - name: helpers.py
                      deflated: true
                      text: |
                        def add(a, b):
                            return a + b

                    - name: data.bin
                      deflated: false
                      blob: |
                        SGVsbG8gZnJvbSBiaW5hcnkgZGF0YQ==

            # Another nested directory
            - name: assets
              content:
                - name: icons
                  content:
                    - name: app.ico
                      deflated: false
                      blob: |
                        AQIDBAUGBwgJCgsMDQ4P

                - name: styles.css
                  deflated: true
                  text: |
                    body {
                      background: #ffffff;
                    }

    # Suffix multipart — three separate single-file messages whose names match
    # <base>.NN. With multipart_policy=suffix they are merged into one file.
    - files:
        - name: suffixed.00
          text: "Hello, "
    - files:
        - name: suffixed.01
          text: "world"
    - files:
        - name: suffixed.02
          text: "!"

    # Album multipart — one Telegram album. The multipart directive merges all
    # files in the album into one under multipart_policy=album.
    - text: "multipart: true"
      files:
        - name: album_part_a.txt
          text: "foo"
        - name: album_part_b.txt
          text: "bar"

    # Files whose names hunch can parse as TV-show episodes. Used by the
    # `tvshow_pattern` variant to verify that recognized episodes get rerouted
    # to the rendered virtual path, while non-episode files stay put.
    - files:
        - name: Breaking.Bad.S01E01.mkv
          text: "S01E01 payload"
    - files:
        - name: Breaking.Bad.S01E02.mkv
          text: "S01E02 payload"
    - files:
        - name: The.Walking.Dead.S02E05.mkv
          text: "TWD payload"

    # Single-digit numeric extensions are NOT multipart parts (the spec is
    # two-digit `.NN`) — these must stay two separate files even under
    # multipart_policy=suffix.
    - files:
        - name: notes.0
          text: "not a part, "
    - files:
        - name: notes.1
          text: "just a versioned file"

    # Same-named `.NN` part sets in two different virtual directories: each
    # directory merges independently under multipart_policy=suffix and must
    # never be fused across directories.
    - text: |
        path: A/
      files:
        - name: data.bin.00
          text: "alpha-"
    - text: |
        path: A/
      files:
        - name: data.bin.01
          text: "one"
    - text: |
        path: B/
      files:
        - name: data.bin.00
          text: "bravo-"
    - text: |
        path: B/
      files:
        - name: data.bin.01
          text: "two"

    # Telegram album with a `path:` caption but NO `multipart:` directive —
    # the group caption places every part under the directory while keeping
    # the original filenames.
    - text: |
        path: albumdir/
      files:
        - name: album_doc_x.txt
          text: "album doc x"
        - name: album_doc_y.txt
          text: "album doc y"

    # `type: media` forces inline Content-Disposition on a plain binary.
    - text: "type: media"
      files:
        - name: inline.bin
          blob: |
            AAECAwQFBgc=

    # `type: zip` marks a non-.zip filename as a browsable archive.
    - text: "type: zip"
      files:
        - name: bundle.dat
          zip:
            - name: inner.txt
              deflated: true
              text: "inside bundle.dat"
            - name: raw.bin
              deflated: false
              blob: |
                EBESExQV

    # Prefix-collapse demo: with collapse_by_prefix >= 20 these two (and only
    # these two) share a long enough name prefix to be foldered together.
    - files:
        - name: Collapse_Prefix_Demo_Track_01.txt
          text: "collapse one"
    - files:
        - name: Collapse_Prefix_Demo_Track_02.txt
          text: "collapse two"

    # A real Telegram photo (sent as photo, not document). Bytes are
    # generated by the runner; layout helpers skip it because Telegram
    # re-encodes photos and the exposed name is photo_<id>.jpg.
    - text: Photo message
      files:
        - name: test_photo.jpg
          photo: true
